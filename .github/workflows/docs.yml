name: Publicar documentación en Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'functions/src/**'
      - 'functions/typedoc.json'
      - 'functions/package.json'
      - 'swagger.yaml'
      - '.github/workflows/docs.yml'

  # Permite ejecutar manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Generar y publicar documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: functions
        env:
          DATABASE_URL: postgres://localhost:5432/postgres

      - name: Generar documentación con TypeDoc
        run: npm run docs
        working-directory: functions

      - name: Construir Swagger UI
        run: |
          mkdir -p functions/docs/swagger
          cp swagger.yaml functions/docs/swagger/swagger.yaml
          # Descargar swagger-ui-dist desde npm cache ya instalado
          cp -r functions/node_modules/swagger-ui-dist/{swagger-ui-bundle.js,swagger-ui.css,favicon-32x32.png} functions/docs/swagger/ 2>/dev/null || true
          # Generar index.html de Swagger UI
          cat > functions/docs/swagger/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <title>PADI API - Swagger UI</title>
            <link rel="stylesheet" href="swagger-ui.css">
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="swagger-ui-bundle.js"></script>
            <script>
              SwaggerUIBundle({
                url: "swagger.yaml",
                dom_id: '#swagger-ui',
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
                layout: "BaseLayout",
                deepLinking: true
              });
            </script>
          </body>
          </html>
          EOF

      - name: Publicar en Firebase Hosting (docs)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FUNDACIONPADI_41CB2 }}
          projectId: fundacionpadi-41cb2
          target: docs
          channelId: live
