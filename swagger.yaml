# ─────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Identificador único del recurso

  schemas:
    # ── Respuesta genérica ──────────────────────
    CommonResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: ok
        data:
          nullable: true
          description: Payload de la respuesta (varía según el endpoint)
        error:
          type: object
          nullable: true
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            description:
              type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    # ── Auth ────────────────────────────────────
    AuthData:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'

    Tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        nombre:
          type: string
        apellido:
          type: string
        rol:
          type: string
          enum: [equipo_padi, encargado_zona, director, docente]

    RegisterRequest:
      type: object
      required: [nombre, apellido, email, password, rol]
      properties:
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        rol:
          type: string
          enum: [equipo_padi, encargado_zona, director, docente]

    # ── Admin ───────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
          format: email
        rol:
          type: string
          enum: [equipo_padi, encargado_zona, director, docente]

    CreateUserRequest:
      type: object
      required: [nombre, apellido, email, rol]
      properties:
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
          format: email
        rol:
          type: string
          enum: [equipo_padi, encargado_zona, director, docente]

    # ── Escuelas ────────────────────────────────
    EscuelaRequest:
      type: object
      required: [nombre, zona_id]
      properties:
        nombre:
          type: string
          example: "Escuela N° 12 Malvinas Argentinas"
        direccion:
          type: string
          example: "Av. Siempreviva 742"
        telefono:
          type: string
          example: "011-4444-5555"
        zona_id:
          type: string
          example: "zona-001"

    # ── Estudiantes ─────────────────────────────
    EstudianteRequest:
      type: object
      required: [nombre, apellido]
      properties:
        nombre:
          type: string
        apellido:
          type: string
        fecha_nacimiento:
          type: string
          format: date
          example: "2018-03-15"
        genero_id:
          type: integer
        sala_id:
          type: integer
        escuela_id:
          type: string

    # ── Evaluaciones ────────────────────────────
    EvaluacionRequest:
      type: object
      required: [estudiante_id, tipo_id]
      properties:
        estudiante_id:
          type: string
        tipo_id:
          type: string
          description: Tipo de evaluación
        sala_id:
          type: integer
        escuela_id:
          type: string
        profesor_id:
          type: string

    # ── Zonas ───────────────────────────────────
    ZonaRequest:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          example: "Zona Norte"
        descripcion:
          type: string

    # ── Encargados ──────────────────────────────
    EncargadoRequest:
      type: object
      required: [usuario_id]
      properties:
        usuario_id:
          type: string
        zona_id:
          type: string

  responses:
    BadRequest:
      description: Datos inválidos o faltantes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResponse'
          example:
            success: false
            message: "Faltan datos obligatorios"
            data: null
            error:
              code: VALIDATION_ERROR

    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
          example:
            message: "Token inválido o expirado"

    Forbidden:
      description: Sin permisos para este recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResponse'
          example:
            success: false
            message: "No tienes permisos para realizar esta acción"
            data: null

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResponse'
          example:
            success: false
            message: "Recurso no encontrado"
            data: null

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResponse'
          example:
            success: false
            message: "Error interno del servidor"
            data: null
            error:
              code: INTERNAL_ERROR
