openapi: 3.0.3
info:
  title: PADI API
  description: |
    Documentación de la API REST del backend del sistema PADI.

    ## Autenticación
    La mayoría de los endpoints requieren un token JWT en el header `Authorization: Bearer <token>`.
    Los endpoints bajo `/auth/login`, `/auth/register`, `/auth/refresh-token`, `/auth/reset-password-request` y `/auth/update-password` son públicos.

    ## Roles
    - **equipo_padi**: Acceso total al sistema.
    - **encargado_zona**: Gestión de escuelas y datos de su zona.
    - **director**: Acceso a datos de su escuela.
    - **docente**: Acceso a sus aulas y evaluaciones.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor Local (Docker)
  - url: https://{region}-{project}.cloudfunctions.net/api
    description: Firebase Cloud Functions (producción)
    variables:
      region:
        default: us-central1
      project:
        default: fundacionpadi-41cb2

tags:
  - name: Health
    description: Estado del servicio
  - name: Auth
    description: Autenticación y gestión de sesión
  - name: Admin
    description: Panel de administración de usuarios (solo equipo_padi)
  - name: Aulas
    description: Gestión de aulas y asignación de docentes/estudiantes
  - name: Escuelas
    description: Gestión de instituciones educativas
  - name: Estudiantes
    description: Gestión de estudiantes
  - name: Evaluaciones
    description: Evaluaciones, preguntas y respuestas
  - name: Docentes
    description: Gestión de docentes
  - name: Directivos
    description: Gestión de directivos
  - name: Zonas
    description: Gestión de zonas geográficas (solo equipo_padi)
  - name: Encargados
    description: Gestión de encargados de zona
  - name: Estadisticas
    description: Métricas y reportes analíticos por nivel de acceso (padi, zona, escuela, docente)

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:

  # ── HEALTH ──────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Verificar estado del servicio
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ── AUTH (públicos) ──────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: usuario@padi.edu.ar
                password:
                  type: string
                  format: password
                  example: "MiContraseña123"
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthData'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar nuevo usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthData'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Renovar access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/reset-password-request:
    post:
      tags: [Auth]
      summary: Solicitar reseteo de contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Email de recuperación enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/update-password:
    post:
      tags: [Auth]
      summary: Actualizar contraseña con tokens de recuperación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessToken, refreshToken, newPassword]
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/profile:
    put:
      tags: [Auth]
      summary: Actualizar perfil del usuario autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, apellido]
              properties:
                nombre:
                  type: string
                apellido:
                  type: string
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  profile:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── ADMIN ────────────────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      summary: Listar todos los usuarios
      description: Requiere rol `equipo_padi`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Admin]
      summary: Crear un usuario
      description: Requiere rol `equipo_padi`. Envía un email con contraseña temporal.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/bulk:
    post:
      tags: [Admin]
      summary: Crear usuarios en lote
      description: Requiere rol `equipo_padi`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  items:
                    $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: Proceso completado (puede incluir errores parciales)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  creados:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  errores:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                        error:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{id}/resend-invite:
    post:
      tags: [Admin]
      summary: Reenviar email de invitación
      description: Requiere rol `equipo_padi`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Invitación reenviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{id}:
    delete:
      tags: [Admin]
      summary: Eliminar un usuario
      description: Requiere rol `equipo_padi`. Un admin no puede eliminarse a sí mismo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── AULAS ────────────────────────────────────
  /aulas:
    get:
      tags: [Aulas]
      summary: Listar aulas accesibles según rol
      description: El resultado se filtra automáticamente según el rol del usuario autenticado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de aulas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Aulas]
      summary: Crear un aula
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sala_id, turno]
              properties:
                sala_id:
                  type: integer
                  example: 3
                turno:
                  type: string
                  example: Mañana
                escuela_id:
                  type: string
                  example: "abc123"
                comision:
                  type: string
                  default: Única
      responses:
        '201':
          description: Aula creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /aulas/{id}:
    put:
      tags: [Aulas]
      summary: Actualizar un aula
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sala_id:
                  type: integer
                comision:
                  type: string
                turno:
                  type: string
      responses:
        '200':
          description: Aula actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [Aulas]
      summary: Eliminar un aula
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Aula eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /aulas/{id}/docentes:
    get:
      tags: [Aulas]
      summary: Listar docentes asignados a un aula
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lista de docentes del aula
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /aulas/{id}/asignar-docente:
    post:
      tags: [Aulas]
      summary: Asignar un docente a un aula
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profesor_id]
              properties:
                profesor_id:
                  type: string
      responses:
        '200':
          description: Docente asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /aulas/{id}/desasignar-docente:
    post:
      tags: [Aulas]
      summary: Desasignar un docente de un aula
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profesor_id]
              properties:
                profesor_id:
                  type: string
      responses:
        '200':
          description: Docente desasignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /aulas/{id}/estudiantes:
    get:
      tags: [Aulas]
      summary: Listar estudiantes de un aula
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lista de estudiantes del aula
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /aulas/{id}/asignar-estudiante:
    post:
      tags: [Aulas]
      summary: Asignar un estudiante a un aula
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estudiante_id]
              properties:
                estudiante_id:
                  type: string
      responses:
        '200':
          description: Estudiante asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /aulas/{id}/desasignar-estudiante:
    post:
      tags: [Aulas]
      summary: Desasignar un estudiante de un aula
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estudiante_id]
              properties:
                estudiante_id:
                  type: string
      responses:
        '200':
          description: Estudiante desasignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /docentes/aulas:
    get:
      tags: [Aulas]
      summary: Listar aulas del docente autenticado
      description: Devuelve las aulas asignadas al docente que realiza la petición, con sus estudiantes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aulas del docente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── ESCUELAS ─────────────────────────────────
  /escuelas:
    get:
      tags: [Escuelas]
      summary: Listar escuelas
      description: Roles permitidos `equipo_padi`, `encargado_zona`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de escuelas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Escuelas]
      summary: Crear una escuela
      description: |
        Roles permitidos: `equipo_padi`, `encargado_zona`.
        Al crear la escuela se generan automáticamente aulas para salas 3, 4 y 5 en turno Mañana.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscuelaRequest'
      responses:
        '201':
          description: Escuela creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /escuelas/{id}:
    put:
      tags: [Escuelas]
      summary: Actualizar una escuela
      description: Roles permitidos `equipo_padi`, `encargado_zona`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscuelaRequest'
      responses:
        '200':
          description: Escuela actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [Escuelas]
      summary: Eliminar una escuela
      description: Solo `equipo_padi`. Libera todos los vínculos asociados.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Escuela eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /escuelas/asignar-directivo:
    post:
      tags: [Escuelas]
      summary: Asignar un directivo a una escuela
      description: Solo `equipo_padi`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [escuelaId, usuarioId]
              properties:
                escuelaId:
                  type: string
                usuarioId:
                  type: string
      responses:
        '200':
          description: Directivo asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /escuelas/desasignar-directivo:
    post:
      tags: [Escuelas]
      summary: Desasignar un directivo de su escuela
      description: Solo `equipo_padi`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuarioId]
              properties:
                usuarioId:
                  type: string
      responses:
        '200':
          description: Directivo removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── ESTUDIANTES ──────────────────────────────
  /estudiantes:
    get:
      tags: [Estudiantes]
      summary: Listar estudiantes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de estudiantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Estudiantes]
      summary: Crear un estudiante
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstudianteRequest'
      responses:
        '201':
          description: Estudiante creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /estudiantes/{id}:
    put:
      tags: [Estudiantes]
      summary: Actualizar un estudiante
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstudianteRequest'
      responses:
        '200':
          description: Estudiante actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /estudiantes/bulk:
    post:
      tags: [Estudiantes]
      summary: Crear estudiantes en lote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estudiantes]
              properties:
                estudiantes:
                  type: array
                  items:
                    $ref: '#/components/schemas/EstudianteRequest'
      responses:
        '200':
          description: Proceso completado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /estudiantes/asignar-aula:
    post:
      tags: [Estudiantes]
      summary: Asignar estudiante a un aula
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estudiante_id, aula_id]
              properties:
                estudiante_id:
                  type: string
                aula_id:
                  type: string
